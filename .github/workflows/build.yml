
name: Build TAYF GHOST Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate TAYF GHOST Stealth Source
        run: |
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/com/zrg/tayf app/src/main/res/xml

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.zrg.tayf'
              compileSdk 34
              defaultConfig {
                  applicationId "com.zrg.tayf"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "4.0-STEALTH"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="ghost_cache" path="." />
              <external-files-path name="ghost_ext" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.NFC" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.nfc" android:required="true" />
              <application android:allowBackup="false" android:label="TAYF GHOST" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/zrg/tayf/MainActivity.kt
          package com.zrg.tayf

          import android.Manifest
          import android.animation.ValueAnimator
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.media.ToneGenerator
          import android.net.Uri
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.IsoDep
          import android.os.*
          import android.provider.OpenableColumns
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.animation.LinearInterpolator
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.io.File
          import java.io.ByteArrayInputStream
          import java.security.MessageDigest
          import java.security.SecureRandom
          import java.util.concurrent.TimeUnit
          import javax.crypto.Cipher
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.GCMParameterSpec
          import javax.crypto.spec.PBEKeySpec
          import javax.crypto.spec.SecretKeySpec

          class MainActivity : AppCompatActivity(), NfcAdapter.ReaderCallback {

              private var nfcAdapter: NfcAdapter? = null
              private val client = OkHttpClient.Builder()
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .writeTimeout(60, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              private var isSendMode = true
              private var attachedBytes: ByteArray? = null
              private var attachedName: String = ""
              private var attachedMime: String = ""
              private var cameraPhotoUri: Uri? = null

              private var recorder: MediaRecorder? = null
              private var isRecording = false
              private var recordedAudioFile: File? = null
              private var receivedFile: File? = null
              private var receivedMime: String = ""

              private lateinit var radarView: RadarPulseView
              private lateinit var terminalLog: TextView
              private lateinit var attachmentBadge: TextView
              private lateinit var pinInput: EditText
              private lateinit var noteInput: EditText
              private lateinit var previewImage: ImageView
              private lateinit var openFileBtn: Button
              private lateinit var modeSendBtn: Button
              private lateinit var modeReceiveBtn: Button
              private lateinit var sendControlsBox: LinearLayout
              private lateinit var recordBtn: Button

              private val takePictureLauncher = registerForActivityResult(ActivityResultContracts.TakePicture()) { ok ->
                  if (ok && cameraPhotoUri != null) loadUriPayload(cameraPhotoUri!!, "CAM_CAPTURE_${System.currentTimeMillis()}.jpg", "image/jpeg")
              }

              private val pickAnyFileLauncher = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      val mime = contentResolver.getType(uri) ?: "application/octet-stream"
                      val name = queryFileName(uri)
                      loadUriPayload(uri, name, mime)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#080C11")
                  nfcAdapter = NfcAdapter.getDefaultAdapter(this)
                  buildCyberUI()
              }

              private fun cyberCard(bgHex: String, strokeHex: String, radiusDp: Float = 14f): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(bgHex))
                      setStroke(2, Color.parseColor(strokeHex))
                      cornerRadius = radiusDp * resources.displayMetrics.density
                  }
              }

              private fun buildCyberUI() {
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#080C11")) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 48, 40, 56)
                  }

                  // Header HUD
                  val headerBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cyberCard("#0E141F", "#2A3A4D", 16f)
                      setPadding(32, 28, 32, 28)
                  }
                  val title = TextView(this).apply {
                      text = "TAYF GHOST"
                      textSize = 21f
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      setTextColor(Color.parseColor("#CFB07E"))
                      gravity = Gravity.CENTER
                  }
                  val subTitle = TextView(this).apply {
                      text = "NFC GHOST CARRIER // OPTIONAL PIN"
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#808F9C"))
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 0)
                  }
                  headerBox.addView(title)
                  headerBox.addView(subTitle)

                  // Animated Radar (No high glow / Matte finish)
                  radarView = RadarPulseView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 240).apply { topMargin = 20; bottomMargin = 16 }
                  }

                  // Mode Switcher
                  val modeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 8, 0, 20)
                  }
                  modeSendBtn = Button(this).apply {
                      text = "إرسال (TX)"
                      textSize = 13f
                      typeface = Typeface.MONOSPACE
                      layoutParams = LinearLayout.LayoutParams(0, 120, 1f).apply { rightMargin = 10 }
                      setOnClickListener { switchMode(true) }
                  }
                  modeReceiveBtn = Button(this).apply {
                      text = "استلام (RX)"
                      textSize = 13f
                      typeface = Typeface.MONOSPACE
                      layoutParams = LinearLayout.LayoutParams(0, 120, 1f).apply { leftMargin = 10 }
                      setOnClickListener { switchMode(false) }
                  }
                  modeRow.addView(modeSendBtn)
                  modeRow.addView(modeReceiveBtn)

                  // Crypto Key Input Card (PIN is officially OPTIONAL)
                  val keyCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cyberCard("#0F1624", "#24334A", 14f)
                      setPadding(28, 24, 28, 24)
                  }
                  val keyLabel = TextView(this).apply {
                      text = "🔒 الرمز السري الاختياري (اتركه فارغاً لاعتماد البصمة فقط)"
                      textSize = 11.5f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#C4D1DB"))
                      setPadding(0, 0, 0, 12)
                  }
                  pinInput = EditText(this).apply {
                      hint = "الرمز السري المشترك (اختياري)..."
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setTextColor(Color.parseColor("#CFB07E"))
                      setHintTextColor(Color.parseColor("#5A6B7C"))
                      background = cyberCard("#070A10", "#2B3D59", 10f)
                      setPadding(28, 24, 28, 24)
                      typeface = Typeface.MONOSPACE
                  }
                  keyCard.addView(keyLabel)
                  keyCard.addView(pinInput)

                  // Send Controls Box
                  sendControlsBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cyberCard("#0F1624", "#24334A", 14f)
                      setPadding(28, 24, 28, 24)
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 20 }
                  }
                  noteInput = EditText(this).apply {
                      hint = "رسالة نصية مرافقة (اختياري)..."
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#5A6B7C"))
                      background = cyberCard("#070A10", "#2B3D59", 10f)
                      setPadding(28, 22, 28, 22)
                  }

                  val toolsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 20, 0, 12)
                  }
                  val camBtn = Button(this).apply {
                      text = "📷 كاميرا"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = cyberCard("#192233", "#2A3D5E", 10f)
                      layoutParams = LinearLayout.LayoutParams(0, 115, 1f).apply { rightMargin = 8 }
                      setOnClickListener { launchCamera() }
                  }
                  recordBtn = Button(this).apply {
                      text = "🎙️ صوت"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = cyberCard("#192233", "#5C2631", 10f)
                      layoutParams = LinearLayout.LayoutParams(0, 115, 1f).apply { leftMargin = 4; rightMargin = 4 }
                      setOnClickListener { toggleVoiceRecording() }
                  }
                  val fileBtn = Button(this).apply {
                      text = "📁 ملفات"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = cyberCard("#192233", "#254735", 10f)
                      layoutParams = LinearLayout.LayoutParams(0, 115, 1f).apply { leftMargin = 8 }
                      setOnClickListener { pickAnyFileLauncher.launch(arrayOf("*/*")) }
                  }
                  toolsRow.addView(camBtn)
                  toolsRow.addView(recordBtn)
                  toolsRow.addView(fileBtn)

                  attachmentBadge = TextView(this).apply {
                      text = "لا يوجد ملف (يدعم: صور، فيديو، مستندات، صوتيات)"
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#6C7D91"))
                      setPadding(8, 12, 8, 4)
                  }

                  sendControlsBox.addView(noteInput)
                  sendControlsBox.addView(toolsRow)
                  sendControlsBox.addView(attachmentBadge)

                  // Preview & Received File Action
                  previewImage = ImageView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 460).apply { topMargin = 20 }
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      background = cyberCard("#0A0F17", "#24334A", 12f)
                      visibility = View.GONE
                  }

                  openFileBtn = Button(this).apply {
                      text = "▶ فتح الملف المستلم"
                      setTextColor(Color.BLACK)
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      background = cyberCard("#CFB07E", "#CFB07E", 12f)
                      layoutParams = LinearLayout.LayoutParams(-1, 125).apply { topMargin = 16 }
                      visibility = View.GONE
                      setOnClickListener { openReceivedFile() }
                  }

                  // Live Cryptographic Terminal Log
                  val logHeader = TextView(this).apply {
                      text = "▸ حالة النظام وتفاصيل العملية"
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#808F9C"))
                      setPadding(8, 26, 8, 8)
                  }
                  terminalLog = TextView(this).apply {
                      textSize = 12f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#CFB07E"))
                      background = cyberCard("#040609", "#1E2A3A", 12f)
                      setPadding(28, 24, 28, 24)
                      setLineSpacing(6f, 1.1f)
                  }

                  root.addView(headerBox)
                  root.addView(radarView)
                  root.addView(modeRow)
                  root.addView(keyCard)
                  root.addView(sendControlsBox)
                  root.addView(previewImage)
                  root.addView(openFileBtn)
                  root.addView(logHeader)
                  root.addView(terminalLog)

                  scroll.addView(root)
                  setContentView(scroll)
                  switchMode(true)
              }

              private fun logConsole(msg: String, isError: Boolean = false) {
                  terminalLog.setTextColor(Color.parseColor(if (isError) "#C96D7F" else "#CFB07E"))
                  terminalLog.text = msg
              }

              private fun switchMode(send: Boolean) {
                  isSendMode = send
                  modeSendBtn.background = cyberCard(if (send) "#1F3528" else "#0F1624", if (send) "#CFB07E" else "#24334A", 12f)
                  modeSendBtn.setTextColor(Color.parseColor(if (send) "#CFB07E" else "#6B7C8C"))
                  modeReceiveBtn.background = cyberCard(if (!send) "#182C3D" else "#0F1624", if (!send) "#CFB07E" else "#24334A", 12f)
                  modeReceiveBtn.setTextColor(Color.parseColor(if (!send) "#CFB07E" else "#6B7C8C"))

                  sendControlsBox.visibility = if (send) View.VISIBLE else View.GONE
                  openFileBtn.visibility = View.GONE
                  if (!send) previewImage.visibility = View.GONE

                  logConsole(
                      if (send) "[TX-READY] بانتظار تجهيز الحزمة (اختياري: رمز سري)\n[NFC-IDLE] قرّب بطاقة التعريف الوطنية لظهر الهاتف لبدء النقل المشفر..."
                      else "[RX-READY] الاستلام: أدخل نفس الرمز (إن وُجد) ثم لامس بطاقة التعريف لقراءة الحزمة..."
                  )
              }

              private fun launchCamera() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                      return
                  }
                  val file = File(cacheDir, "GHOST_IMG_${System.currentTimeMillis()}.jpg")
                  cameraPhotoUri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                  takePictureLauncher.launch(cameraPhotoUri)
              }

